services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fettl
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fettl"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    ports:
      - "127.0.0.1:3000:3000"
    env_file: ./apps/api/.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/fettl?schema=public
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - API_URL=${API_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm --filter @fettl/api exec prisma migrate deploy && pnpm --filter @fettl/api dev"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${WEB_HOST:-localhost}
      - VITE_API_URL=${API_URL:-http://localhost:3000}
    depends_on:
      - api

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - web
      - api

volumes:
  db-data:
